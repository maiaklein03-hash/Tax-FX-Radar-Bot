name: Revisar Tax y Cambiario para Prospectos

on:
  workflow_dispatch:
    inputs:
      modo_prueba:
        description: "Evaluar muestras actuales sin modificar el historial"
        required: true
        default: false
        type: boolean
  schedule:
    # 09:25 de Buenos Aires, lunes a viernes.
    - cron: "25 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: prospectos-tax-fx
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MODO_PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.modo_prueba || 'false' }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Actualizar estado antes de ejecutar
        run: git pull --ff-only origin main

      - name: Revisar fuentes oficiales
        run: python bot.py

      - name: Guardar historial
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false) }}
        run: |
          git add -A -- estado.json
          if git diff --cached --quiet; then
            echo "No hay cambios de estado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar historial Tax y FX"
          git pull --rebase origin main
          git push origin HEAD:main
